<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Voxly</title>
  <style>
    body {
      width: 300px;
      margin: 0;
      padding: 18px;
      background: #0f1011;
      color: #f7f8f8;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    }
    .brand {
      font-size: 16px;
      font-weight: 600;
      letter-spacing: -0.3px;
      margin-bottom: 14px;
    }
    .brand span { color: #5e6ad2; }
    .status {
      font-size: 12px;
      color: #8a8f98;
      margin: 0 0 4px;
    }
    .usage {
      font-size: 12px;
      color: #62666d;
      margin: 0 0 16px;
    }
    button {
      display: block;
      width: 100%;
      padding: 10px;
      margin-bottom: 8px;
      border-radius: 8px;
      font-size: 13px;
      font-weight: 500;
      cursor: pointer;
      border: 1px solid rgba(255,255,255,0.08);
      background: rgba(255,255,255,0.04);
      color: #d0d6e0;
      font-family: inherit;
    }
    button:hover { background: rgba(255,255,255,0.08); color: #f7f8f8; }
    .primary { background: #5e6ad2; border-color: #5e6ad2; color: #fff; }
    .primary:hover { background: #828fff; color: #fff; }
    .hint {
      font-size: 11px;
      color: #62666d;
      line-height: 1.5;
      margin: 12px 0 0;
      padding-top: 12px;
      border-top: 1px solid rgba(255,255,255,0.05);
    }
  </style>
</head>
<body>
  <div class="brand">vox<span>ly</span></div>
  <p class="status" id="status">Checking sign-in status…</p>
  <p class="usage" id="usage"></p>

  <button class="primary" id="open-dashboard">Open Dashboard</button>
  <button id="sign-in" hidden>Sign in to use rewrites</button>
  <button id="sign-out" hidden>Sign out</button>

  <p class="hint">
    Select text on any page, then right-click → “Rewrite with Voxly”, or press
    <kbd>Ctrl</kbd>+<kbd>Shift</kbd>+<kbd>R</kbd>.
  </p>

  <script src="popup.js"></script>
</body>
</html>
